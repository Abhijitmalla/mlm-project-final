<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Sessions — Admin Panel | VK Services Enterprise</title>
<link rel="icon" type="image/png" href="./assets/image/VK-Enterprise-Logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./../dist/output.css">
<script src="../api-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  body{
    background:
      radial-gradient(circle at 10% 0%, rgba(99,102,241,0.10), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(217,70,239,0.08), transparent 35%),
      #0A0E17;
    color:#E5E7EB;
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:#2a2f3d;border-radius:99px;}
  .row-fade{animation:fadeIn .35s ease both;}
  .stat-card{cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;}
  .stat-card:hover{transform:translateY(-2px);box-shadow:0 10px 28px -6px rgba(0,0,0,.5);}
  .stat-card.active{outline:2px solid rgba(255,255,255,.7); outline-offset:2px;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .toast{transition:transform .35s ease, opacity .35s ease;}
</style>
</head>
<body>
<div class="min-h-screen">
  <div class="mx-auto">
    <!-- Topbar -->
    <header class="sticky top-0 z-20 bg-[#0D1220]/90 backdrop-blur border-b border-white/5 px-4 sm:px-7 py-4 flex justify-between gap-4">
      <div class="flex flex-col gap-4 pt-1">
        <div>
          <h1 class="font-body font-bold text-lg sm:text-xl text-white">Admin Panel</h1>
          <p class="text-xs text-gray-400 mt-0.5">VK Services Enterprise</p>
        </div>
        <!-- Tab switcher -->
        <div class="flex items-center bg-white/5 border border-white/10 rounded-full p-1 gap-1 w-fit shadow-sm">
          <a href="index.html" class="flex items-center gap-2 px-5 py-2 rounded-full text-sm font-semibold text-gray-400 hover:text-white hover:bg-white/5 transition-all">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16v4H4zM4 12h16M4 16h16M4 20h10"/>
            </svg>
            Enquiries
          </a>
          <a href="leads.html" class="flex items-center gap-2 px-5 py-2 rounded-full text-sm font-semibold text-gray-400 hover:text-white hover:bg-white/5 transition-all">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            Leads
          </a>
          <button class="flex items-center gap-2 px-5 py-2 rounded-full text-sm font-bold bg-purple-600 text-white shadow-md shadow-purple-900/40 transition-all cursor-default">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 3v4M16 3v4M7 11h10M8 15h4"/>
            </svg>
            Live Sessions
          </button>
        </div>
      </div>
      <div class="flex flex-col items-end gap-3 pt-1">
        <div class="flex items-center gap-2.5">
          <span class="hidden sm:inline-flex items-center gap-1.5 bg-emerald-500/10 text-emerald-400 text-xs font-semibold px-3 py-1.5 rounded-full border border-emerald-500/30">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Live
          </span>
          <div class="relative">
            <button id="userMenuBtn" class="flex items-center gap-2 bg-[#0D1220] hover:bg-white/5 border border-white/10 rounded-full pl-1 pr-3 py-1 transition-all focus:outline-none focus:ring-2 focus:ring-purple-500 shadow-sm">
              <div class="w-7 h-7 rounded-full bg-gradient-to-br from-purple-500 to-fuchsia-600 text-white flex items-center justify-center font-display font-bold text-[10px]">VK</div>
              <span class="text-sm font-semibold text-gray-200">Admin</span>
              <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>
            <div id="userDropdown" class="hidden absolute right-0 mt-2 w-48 bg-[#0D1220] border border-white/10 rounded-xl shadow-lg py-1.5 z-50">
              <button id="logoutBtn" class="w-full text-left px-4 py-2 text-sm text-gray-200 hover:bg-white/5 hover:text-white transition-colors flex items-center gap-2.5">
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Sign Out
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="p-4 sm:p-7">
      <p id="pageMessage" class="mb-5 hidden rounded-lg border px-4 py-3 text-sm"></p>

      <!-- Stat cards -->
      <div class="grid grid-cols-2 md:grid-cols-3 gap-3.5 mb-6" id="statCards"></div>

      <!-- Active filter pill -->
      <div id="activeFilterPill" class="hidden mb-4 flex items-center gap-2">
        <span class="inline-flex items-center gap-2 bg-purple-500/10 text-purple-300 text-xs font-semibold px-3 py-1.5 rounded-full border border-purple-500/30">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
          <span id="activeFilterLabel">Filtered</span>
        </span>
        <button id="clearFilterBtn" class="text-xs text-gray-500 hover:text-gray-200 underline transition-colors">Clear filter</button>
      </div>

      <!-- Table card -->
      <div class="bg-[#0D1220] border border-white/10 rounded-2xl shadow-card overflow-hidden">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3.5 px-5 sm:px-6 py-5 border-b border-white/5">
          <div class="flex items-center gap-2.5">
            <h2 class="font-display font-bold text-[17px] text-white">Live Session Registrations</h2>
            <span id="resultsBadge" class="bg-purple-500/10 text-purple-300 text-xs font-semibold px-2.5 py-1 rounded-full border border-purple-500/20">0 results</span>
          </div>
          <div class="flex items-center gap-2.5 flex-wrap">
            <div class="relative">
              <svg class="w-4 h-4 text-purple-400/70 absolute left-3.5 top-1/2 -translate-y-1/2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-3.5-3.5"/></svg>
              <input id="searchInput" type="text" placeholder="Search name, mobile, email..." class="w-full sm:w-64 bg-[#0A0E17] border border-purple-500/30 rounded-full pl-10 pr-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-500/30 focus:border-purple-400/50 transition-all">
            </div>
            <select id="statusFilterTop" class="bg-[#0A0E17] border border-cyan-500/30 rounded-full px-3.5 py-2.5 text-sm text-cyan-300 focus:outline-none focus:ring-2 focus:ring-cyan-500/30">
              <option value="">All Status</option>
              <option value="Pending">Pending</option>
              <option value="Scheduled">Scheduled</option>
            </select>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left">
            <thead>
              <tr class="bg-gradient-to-r from-purple-700 via-fuchsia-700 to-pink-600">
                <th class="px-5 py-4 font-bold text-sm uppercase tracking-wider text-white">Registrant</th>
                <th class="px-5 py-4 font-bold text-sm uppercase tracking-wider text-white">Contact</th>
                <th class="px-5 py-4 font-bold text-sm uppercase tracking-wider text-white">Payment</th>
                <th class="px-5 py-4 font-bold text-sm uppercase tracking-wider text-white">Request</th>
                <th class="px-5 py-4 font-bold text-sm uppercase tracking-wider text-white">Status</th>
                <th class="px-5 py-4 font-bold text-sm uppercase tracking-wider text-white">Session time</th>
                <th class="px-5 py-4 font-bold text-sm uppercase tracking-wider text-white text-center">Action</th>
              </tr>
            </thead>
            <tbody id="registrationsBody" class="divide-y divide-white/5">
              <tr><td colspan="7" class="p-8 text-center text-gray-400">Loading registrations…</td></tr>
            </tbody>
          </table>
          <div id="emptyState" class="hidden py-16 text-center text-gray-500 text-sm">No registrations match your search.</div>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="scheduleModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-4 backdrop-blur-sm">
  <form id="scheduleForm" class="w-full max-w-md rounded-2xl bg-[#0D1220] border border-white/10 p-6 text-gray-200 shadow-2xl">
    <div class="mb-5 flex items-start justify-between">
      <div>
        <h2 class="text-xl font-bold text-white">Schedule live session</h2>
        <p id="scheduleFor" class="mt-1 text-sm text-gray-400"></p>
      </div>
      <button type="button" id="closeSchedule" class="text-2xl text-gray-500 hover:text-white">&times;</button>
    </div>
    <label class="mb-1 block text-sm font-semibold text-gray-400">Start date and time (India)</label>
    <input id="scheduledAt" required type="datetime-local" class="mb-4 w-full rounded-lg bg-[#0A0E17] border border-white/10 px-3 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-purple-500/40" style="color-scheme: dark;">
    <label class="mb-1 block text-sm font-semibold text-gray-400">Duration (minutes)</label>
    <input id="durationMinutes" required type="number" min="15" max="480" value="60" class="mb-5 w-full rounded-lg bg-[#0A0E17] border border-white/10 px-3 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-purple-500/40">
    <p id="scheduleError" class="mb-3 hidden text-sm text-red-400 bg-red-500/10 border border-red-500/30 rounded px-3 py-2"></p>
    <button id="scheduleSubmit" class="w-full rounded-lg bg-purple-600 py-3 font-bold text-white hover:bg-purple-500 transition-colors shadow-md shadow-purple-900/40">Create Meet invite &amp; email user</button>
  </form>
</div>

<script>
  const token = sessionStorage.getItem('adminToken'); if (!token) window.location.href = 'index.html';
  const body = document.getElementById('registrationsBody'); 
  let selected = null;
  let allRegs = [];
  let activeCardFilter = '';
  let activeSearch = '';
  let activeStatus = '';

  const escapeHtml = (value = '') => String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  function showMessage(message, error = false) { 
    const el = document.getElementById('pageMessage'); 
    el.textContent = message; 
    el.classList.remove('hidden');
    el.className = `mb-5 rounded-lg border px-4 py-3 text-sm ${error ? 'border-red-800 bg-red-950 text-red-200' : 'border-green-800 bg-green-950 text-green-200'}`; 
  }
  function formatDate(value) { return value ? new Date(value).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }) : '—'; }

  async function loadRegistrations() { 
    try { 
      const response = await fetch(`${CONFIG.API_BASE_URL}/live-sessions/registrations`, { headers: { Authorization: `Bearer ${token}` } }); 
      const result = await response.json(); 
      if (!response.ok) throw new Error(result.message || 'Could not load registrations.'); 
      
      allRegs = result.data.map(r => ({...r, status: r.status || 'Pending'}));
      renderStats();
      renderTable();
    } catch (error) { 
      body.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-400">${escapeHtml(error.message)}</td></tr>`; 
    } 
  }

  function getFiltered() {
    return allRegs.filter(r => {
      const q = activeSearch.toLowerCase();
      const matchSearch = !q || r.name.toLowerCase().includes(q) || r.email.toLowerCase().includes(q) || String(r.mobile).includes(q);
      const matchStatus = !activeStatus || r.status === activeStatus;
      return matchSearch && matchStatus;
    });
  }

  function renderStats() {
    const total = allRegs.length;
    const scheduled = allRegs.filter(r => r.status === 'Scheduled').length;
    const pending = allRegs.filter(r => r.status === 'Pending').length;

    const stats = [
      { key: 'total', label: 'TOTAL REGISTRATIONS', value: total, icon: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>', gradient: 'from-blue-600 to-indigo-700' },
      { key: 'Pending', label: 'PENDING', value: pending, icon: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>', gradient: 'from-orange-500 to-amber-600' },
      { key: 'Scheduled', label: 'SCHEDULED', value: scheduled, icon: '<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>', gradient: 'from-teal-500 to-emerald-600' }
    ];

    document.getElementById('statCards').innerHTML = stats.map(s => {
      const isActive = activeCardFilter === s.key;
      const activeCls = isActive ? `ring-2 ring-white/70 ring-offset-2 ring-offset-[#0A0E17] scale-[1.02] shadow-lg` : '';
      const clickHint = isActive ? 'opacity-100' : 'opacity-0 group-hover:opacity-80';
      return `
      <div data-card-key="${s.key}" class="stat-card group bg-gradient-to-br ${s.gradient} rounded-2xl shadow-card p-5 text-white ${activeCls} relative select-none">
        <div class="flex items-center justify-between mb-3">
          <span class="text-sm font-bold tracking-wide text-white/90 uppercase">${s.label}</span>
          <div class="w-9 h-9 rounded-lg bg-white/15 text-white flex items-center justify-center shrink-0">
            <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${s.icon}</svg>
          </div>
        </div>
        <div class="font-body font-bold text-3xl text-white">${s.value}</div>
        <div class="mt-2 text-[10px] font-semibold text-white/80 ${clickHint} transition-opacity flex items-center gap-1">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
          ${isActive ? 'Click to clear' : 'Click to filter'}
        </div>
      </div>
      `;
    }).join('');
  }

  function renderTable() {
    const rows = getFiltered();
    document.getElementById('resultsBadge').textContent = `${rows.length} results`;
    const emptyState = document.getElementById('emptyState');
    
    if (rows.length === 0) {
      body.innerHTML = '';
      emptyState.classList.remove('hidden');
      return;
    }
    emptyState.classList.add('hidden');

    body.innerHTML = rows.map(row => `
      <tr class="row-fade border-b border-white/5 last:border-0 hover:bg-white/[0.03] transition-colors">
        <td class="px-5 py-4 align-middle">
          <div class="font-semibold text-white text-base">${escapeHtml(row.name)}</div>
        </td>
        <td class="px-5 py-4 align-middle">
          <div class="text-gray-300">${escapeHtml(row.email)}</div>
          <div class="font-mono text-sm text-cyan-300 mt-0.5">${escapeHtml(row.mobile)}</div>
        </td>
        <td class="px-5 py-4 align-middle">
          <div class="text-xs text-gray-400">Ord: <span class="text-gray-300 font-mono">${escapeHtml(row.order_id || 'N/A')}</span></div>
          <div class="text-xs text-gray-400 mt-0.5">Pay: <span class="text-gray-300 font-mono">${escapeHtml(row.payment_id || 'N/A')}</span></div>
        </td>
        <td class="px-5 py-4 align-middle">
          <div class="text-sm text-gray-400 max-w-xs truncate" title="${escapeHtml(row.message || '')}">${escapeHtml(row.message || '—')}</div>
        </td>
        <td class="px-5 py-4 align-middle">
          <span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-semibold ${row.status === 'Scheduled' ? 'bg-emerald-500/10 text-emerald-300 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-300 border border-amber-500/20'}">
            ${row.status === 'Scheduled' ? '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>' : '<span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>'}
            ${row.status}
          </span>
        </td>
        <td class="px-5 py-4 align-middle text-sm text-gray-300">
          ${formatDate(row.scheduled_at)}
        </td>
        <td class="px-5 py-4 align-middle text-center">
          ${row.status === 'Scheduled' 
            ? `<a class="inline-flex items-center gap-1.5 text-sm font-semibold text-purple-400 hover:text-purple-300 transition-colors bg-purple-500/10 px-3 py-1.5 rounded-lg border border-purple-500/20" href="${escapeHtml(row.meeting_link)}" target="_blank" rel="noopener">Open Meet <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg></a>` 
            : `<button class="scheduleBtn text-sm font-semibold text-white bg-purple-600 hover:bg-purple-500 transition-colors px-4 py-1.5 rounded-lg shadow-md" data-id="${row.id}" data-name="${escapeHtml(row.name)}">Schedule</button>`}
        </td>
      </tr>
    `).join('');

    document.querySelectorAll('.scheduleBtn').forEach(button => button.addEventListener('click', () => openSchedule(button.dataset.id, button.dataset.name)));
  }

  /* Filter logic */
  document.getElementById('searchInput').addEventListener('input', (e) => {
    activeSearch = e.target.value;
    renderTable();
  });
  
  document.getElementById('statusFilterTop').addEventListener('change', (e) => {
    activeStatus = e.target.value;
    activeCardFilter = activeStatus || '';
    if (!activeStatus) hidePill();
    else showPill(activeStatus + ' sessions');
    renderStats();
    renderTable();
  });

  document.getElementById('statCards').addEventListener('click', (e) => {
    const card = e.target.closest('[data-card-key]');
    if (!card) return;
    const key = card.dataset.cardKey;

    if (key === 'total') {
      activeCardFilter = 'total';
      activeStatus = '';
      document.getElementById('statusFilterTop').value = '';
      hidePill();
    } else {
      activeCardFilter = key;
      activeStatus = key;
      document.getElementById('statusFilterTop').value = key;
      showPill(key + ' sessions');
    }
    renderStats();
    renderTable();
  });

  function showPill(label) {
    const pill = document.getElementById('activeFilterPill');
    document.getElementById('activeFilterLabel').textContent = 'Showing: ' + label;
    pill.classList.remove('hidden');
  }
  function hidePill() {
    document.getElementById('activeFilterPill').classList.add('hidden');
  }
  document.getElementById('clearFilterBtn').addEventListener('click', () => {
    activeCardFilter = '';
    activeStatus = '';
    document.getElementById('statusFilterTop').value = '';
    hidePill();
    renderStats();
    renderTable();
  });

  /* User Menu */
  const userMenuBtn = document.getElementById('userMenuBtn');
  const userDropdown = document.getElementById('userDropdown');
  if (userMenuBtn && userDropdown) {
    userMenuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      userDropdown.classList.toggle('hidden');
    });
    document.addEventListener('click', (e) => {
      if (!userMenuBtn.contains(e.target) && !userDropdown.contains(e.target)) {
        userDropdown.classList.add('hidden');
      }
    });
  }
  document.getElementById('logoutBtn')?.addEventListener('click', () => {
    sessionStorage.removeItem('adminLoggedIn');
    sessionStorage.removeItem('adminToken');
    window.location.href = 'index.html';
  });

  /* Modal Logic */
  function openSchedule(id, name) { 
    selected = id; 
    document.getElementById('scheduleFor').textContent = `Create an invitation for ${name}.`; 
    document.getElementById('scheduleModal').classList.remove('hidden');
    document.getElementById('scheduleModal').classList.add('flex');
  }
  function closeSchedule() { 
    document.getElementById('scheduleModal').classList.remove('flex');
    document.getElementById('scheduleModal').classList.add('hidden');
    document.getElementById('scheduleError').classList.add('hidden'); 
  }
  document.getElementById('closeSchedule').addEventListener('click', closeSchedule);
  
  document.getElementById('scheduleForm').addEventListener('submit', async event => { 
    event.preventDefault(); 
    const button = document.getElementById('scheduleSubmit'); 
    const error = document.getElementById('scheduleError'); 
    button.disabled = true; 
    button.textContent = 'Creating invitation…'; 
    error.classList.add('hidden'); 
    try { 
      const scheduledAt = new Date(document.getElementById('scheduledAt').value).toISOString(); 
      const response = await fetch(`${CONFIG.API_BASE_URL}/live-sessions/registrations/${selected}/schedule`, { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, 
        body: JSON.stringify({ scheduledAt, durationMinutes: document.getElementById('durationMinutes').value }) 
      }); 
      const result = await response.json(); 
      if (!response.ok) throw new Error(result.message || 'Could not schedule this session.'); 
      closeSchedule(); 
      showMessage(result.message); 
      loadRegistrations(); 
    } catch (err) { 
      error.textContent = err.message; 
      error.classList.remove('hidden'); 
    } finally { 
      button.disabled = false; 
      button.textContent = 'Create Meet invite & email user'; 
    } 
  });
  
  loadRegistrations();
</script>
</body>
</html>
