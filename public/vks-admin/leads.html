  <!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <link rel="icon" type="image/png" href="./assets/image/VK-Enterprise-Logo.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./../dist/output.css">

  <style>
    body{
      background:
        radial-gradient(circle at 10% 0%, rgba(99,102,241,0.10), transparent 40%),
        radial-gradient(circle at 90% 10%, rgba(217,70,239,0.08), transparent 35%),

      font-family:'Inter',sans-serif;
      -webkit-font-smoothing:antialiased;
      min-height:100vh;
    }
    ::-webkit-scrollbar{height:8px;width:8px;}
    ::-webkit-scrollbar-thumb{background:#2a2f3d;border-radius:99px;}
    .row-fade{animation:fadeIn .35s ease both;}
    .stat-card{cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;}
    .stat-card:hover{transform:translateY(-2px);box-shadow:0 10px 28px -6px rgba(0,0,0,.5);}
    .stat-card.active{outline:2px solid rgba(255,255,255,.7); outline-offset:2px;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
    .toast{transition:transform .35s ease, opacity .35s ease;}
    .status-select{appearance:none;-webkit-appearance:none;background-repeat:no-repeat;background-position:right .6rem center;background-size:12px;padding-right:1.9rem;}
    .amt-tick.saved{animation:pop .4s ease;}
    @keyframes pop{0%{transform:scale(1);}45%{transform:scale(1.25);}100%{transform:scale(1);}}
    input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  </style>
  </head>
  <body>

  <div class="min-h-screen">
    <div class=" mx-auto">

      <!-- Topbar -->
      <header class="sticky top-0 z-20 bg-[#0D1220]/90 backdrop-blur border-b border-white/5 px-4 sm:px-7 py-4 flex justify-between gap-4">

          </div>

          <!-- Tab switcher -->
          <div class="flex items-center bg-white/5 border border-white/10 rounded-full p-1 gap-1 w-fit shadow-sm">
            <a href="index.html"
              class="flex items-center gap-2 px-5 py-2 rounded-full text-sm font-semibold text-gray-400 hover:text-white hover:bg-white/5 transition-all">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16v4H4zM4 12h16M4 16h16M4 20h10"/>
              </svg>
              Enquiries
            </a>
            <button id="navActiveLeads" onclick="switchView('active')"
              class="flex items-center gap-2 px-5 py-2 rounded-full text-sm font-bold bg-purple-600 text-white shadow-md shadow-purple-900/40 transition-all">

            <button id="navArchivedLeads" onclick="switchView('archived')"

            <div class="relative">

                <div class="w-7 h-7 rounded-full bg-gradient-to-br from-purple-500 to-fuchsia-600 text-white flex items-center justify-center font-display font-bold text-[10px]">VK</div>
                <span class="text-sm font-semibold text-gray-200">Admin</span>

              </button>

                  <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>

                  <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>

      <main class="p-4 sm:p-7">

        <!-- Stat cards -->
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3.5 mb-6" id="statCards"></div>
        <!-- Active filter pill -->
        <div id="activeFilterPill" class="hidden mb-4 flex items-center gap-2">

        <!-- Table card -->

          <!-- Card header / toolbar -->

                <input id="searchInput" type="text" placeholder="Search name, mobile, email..." class="w-full sm:w-64 bg-[#0A0E17] border border-purple-500/30 rounded-full pl-10 pr-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-500/30 focus:border-purple-400/50 transition-all">
              </div>
              <select id="serviceFilter" class="bg-[#0A0E17] border border-cyan-500/30 rounded-full px-3.5 py-2.5 text-sm text-cyan-300 focus:outline-none focus:ring-2 focus:ring-cyan-500/30">

                <option value="Accepted">Accepted</option>

          <!-- ===== Desktop table ===== -->

            <table class="w-full text-sm">

                <tr class="bg-gradient-to-r from-purple-700 via-fuchsia-700 to-pink-600 text-left">

  <!-- Change Password Modal -->

          <label class="block text-sm font-semibold text-gray-400 mb-1">Old Password</label>

            <input type="password" id="oldPassword" autocomplete="current-password" class="w-full bg-[#0A0E17] border border-white/10 rounded-lg pl-3 pr-10 py-2.5 text-gray-100 focus:outline-none focus:ring-2 focus:ring-purple-500/40" required>
            <button type="button" id="toggleOldPassword" aria-label="Show password" class="absolute top-1/2 -translate-y-1/2 text-gray-400 hover:text-purple-400 transition-colors" style="right: 12px;">

            <button type="button" id="toggleNewPassword" aria-label="Show password" class="absolute top-1/2 -translate-y-1/2 text-gray-400 hover:text-purple-400 transition-colors" style="right: 12px;">

            <input type="password" id="confirmPassword" autocomplete="new-password" class="w-full bg-[#0A0E17] border border-white/10 rounded-lg pl-3 pr-10 py-2.5 text-gray-100 focus:outline-none focus:ring-2 focus:ring-purple-500/40" required>
            <button type="button" id="toggleConfirmPassword" aria-label="Show password" class="absolute top-1/2 -translate-y-1/2 text-gray-400 hover:text-purple-400 transition-colors" style="right: 12px;">

          <button type="button" id="closeChangePasswordModal" class="px-4 py-2.5 text-sm font-semibold text-gray-300 bg-white/5 rounded-lg hover:bg-white/10 transition-colors">Cancel</button>
          <button type="submit" id="submitChangePasswordBtn" class="px-4 py-2.5 text-sm font-bold text-white bg-purple-600 rounded-lg hover:bg-purple-500 transition-colors shadow-md shadow-purple-900/40">Change Password</button>
        </div>

  <!-- Toast -->
  <div id="toast" class="toast fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-20 opacity-0 bg-[#161B29] border border-white/10 text-white text-sm font-semibold px-5 py-3 rounded-full shadow-2xl z-50 flex items-center gap-2">
    <svg class="w-4 h-4 text-purple-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg>
    <span id="toastText">Updated</span>
  </div>

  <script>
  /* ============ DATA STATE ============ */
  let leads = [];
  let currentView = 'active'; // 'active' or 'archived'

  function switchView(view) {
    if (currentView === view) return;
    currentView = view;
    
    const navActive = document.getElementById('navActiveLeads');
    const navArchived = document.getElementById('navArchivedLeads');
    const pageTitle = document.querySelector('h2.font-display');
    
    const activeClasses = "flex items-center gap-2 px-5 py-2 rounded-full text-sm font-bold bg-purple-600 text-white shadow-md shadow-purple-900/40 transition-all".split(" ");
    const inactiveClasses = "flex items-center gap-2 px-5 py-2 rounded-full text-sm font-semibold text-gray-400 hover:text-white hover:bg-white/5 transition-all".split(" ");
    
    if (view === 'active') {
      navActive.className = activeClasses.join(" ");
      navArchived.className = inactiveClasses.join(" ");
      if(pageTitle) pageTitle.textContent = "All Leads";
    } else {
      navArchived.className = activeClasses.join(" ");
      navActive.className = inactiveClasses.join(" ");
      if(pageTitle) pageTitle.textContent = "Archived Leads";
    }
    
    // reset filters
    activeSearch = "";
    activeService = "";
    activeStatus = "";
    activeCardFilter = "";
    document.getElementById('searchInput').value = "";
    document.getElementById('serviceFilter').value = "";
    document.getElementById('statusFilterTop').value = "";
    hidePill();
    
    fetchLeads();
  }

  async function fetchLeads() {
    const token = sessionStorage.getItem('adminToken');
    if (!token) {
      window.location.href = 'index.html';
      return;
    }
    
    try {
      const endpoint = currentView === 'archived' ? '/leads/archive' : '/leads/all';
      const res = await fetch(`https://vkservicesenterprise.in/api${endpoint}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      if (data.success) {
        leads = data.data.map(l => ({
          id: l.id,
          name: l.name,
          mobile: l.mobile,
          email: l.email,
          source: l.source || '',
          service: l.service_name || l.service,
          status: statusStyles[l.status] ? l.status : "Positive",
          amount: Number(l.amount) || 0
        }));
        document.getElementById('serviceFilter').innerHTML = '<option value="">All Services</option>';
        document.getElementById('serviceFilter').dataset.done = "";
        populateServiceFilter();
        renderStats();
        renderAll();
      } else {
        console.error("Failed to fetch leads:", data.message);
      }
    } catch(err) {
      console.error("Error fetching leads:", err);
    }
  }

  const serviceIcons = {
    "MLM Plan Video Making": `<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M10 9.5v5l4-2.5z"/>`,
    "Customized MLM Software Development": `<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 22h8M12 18v4"/>`,
    "MLM Plan PDF Making": `<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15h6M9 11h2"/>`,
    "Latest MLM Database": `<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/>`,
    "Result Based Promotion": `<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>`,
    "MLM Leader Website": `<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>`,
  };

  /* Dark-theme badge palette: translucent fill + colored border + colored text, matching the reference screenshot */
  const statusStyles = {
    Positive:   { bg:'bg-blue-500/10',    text:'text-blue-300'    },
    Negative:   { bg:'bg-gray-500/10',    text:'text-gray-300'    },
    Accepted:   { bg:'bg-orange-500/10',  text:'text-orange-300'  },
    Conversion: { bg:'bg-emerald-500/10', text:'text-emerald-300' },
  };
  const arrowFor = (hex) => {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="${hex}" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>`;
    return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
  };
  const arrowColor = { Positive:'#93c5fd', Negative:'#d1d5db', Accepted:'#fdba74', Conversion:'#6ee7b7' };

  let activeSearch = "";
  let activeService = "";
  let activeStatus = "";

  let currentPage = 1;
  const itemsPerPage = 10;

  /* ============ ICONS ============ */
  const waSvg = `<svg viewBox="0 0 448 512" class="w-5 h-5 fill-current"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/></svg>`;
  const tgSvg = `<svg viewBox="0 0 240 240" class="w-5 h-5 fill-current"><path d="M120 0a120 120 0 1 0 0 240 120 120 0 0 0 0-240zm54.5 81.6-19.6 92.5c-1.5 6.6-5.4 8.2-10.9 5.1l-30.1-22.2-14.5 14c-1.6 1.6-3 3-6.1 3l2.2-30.9 56.3-50.9c2.4-2.2-.5-3.4-3.8-1.2l-69.6 43.9-30-9.4c-6.5-2-6.6-6.5 1.4-9.7l117.3-45.2c5.4-2 10.1 1.3 8.4 9z"/></svg>`;

  function toast(msg){
    const t = document.getElementById('toast');
    document.getElementById('toastText').textContent = msg;
    t.style.transform = 'translate(-50%,0)';
    t.style.opacity = '1';
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(()=>{ t.style.transform='translate(-50%,5rem)'; t.style.opacity='0'; }, 1600);
  }

  function sanitizeMobile(raw) {
    // Remove ALL non-digit characters: spaces, dashes, +, brackets, etc.
    let digits = String(raw).replace(/\D/g, '');
    // Remove leading 0 (e.g. 0XXXXXXXXXX → XXXXXXXXXX)
    if (digits.startsWith('0')) digits = digits.slice(1);
    // Remove leading 91 country code if present (e.g. 91XXXXXXXXXX → XXXXXXXXXX)
    if (digits.length === 12 && digits.startsWith('91')) digits = digits.slice(2);
    // Final result should be 10 digits
    return digits;
  }

  function whatsappUrl(mobile) {
    const mob = sanitizeMobile(mobile);
    // api.whatsapp.com/send is more reliable than wa.me for non-contacts
    return `https://api.whatsapp.com/send?phone=91${mob}`;
  }

  function actionIcons(l, size){
    const dim = size || 'w-10 h-10';
    const mob = sanitizeMobile(l.mobile);
    const delSvg = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>`;
    
    const waBtn = `<a href="${whatsappUrl(l.mobile)}" target="_blank" rel="noopener" title="WhatsApp" class="${dim} rounded-full bg-green-500/10 text-green-400 flex items-center justify-center hover:bg-green-500 hover:text-white transition-colors">${waSvg}</a>`;
    const tgBtn = `<a href="https://t.me/+91${mob}" target="_blank" rel="noopener" title="Telegram" class="${dim} rounded-full bg-sky-500/10 text-sky-400 flex items-center justify-center hover:bg-sky-500 hover:text-white transition-colors">${tgSvg}</a>`;
    const callBtn = `<a href="tel:+91${mob}" title="Call" class="${dim} rounded-full bg-orange-500/10 text-orange-400 flex items-center justify-center hover:bg-orange-500 hover:text-white transition-colors">${callSvg}</a>`;
    const delBtnHTML = `<button data-delete-idx="${l.sl-1}" title="Delete Lead" class="${dim} rounded-full bg-red-500/10 text-red-400 flex items-center justify-center hover:bg-red-500 hover:text-white transition-colors">${delSvg}</button>`;
    
    return waBtn + '\n' + tgBtn + '\n' + callBtn + '\n' + delBtnHTML;
  }

  /* ============ STAT CARDS ============ */
  let activeCardFilter = ''; // '', 'Positive', 'Accepted', 'Conversion', 'Revenue'

  function renderStats(){
    const total = leads.length;
    const positive = leads.filter(l=>l.status==='Positive').length;
    const accepted = leads.filter(l=>l.status==='Accepted').length;
    const conversion = leads.filter(l=>l.status==='Conversion').length;
    const negative = leads.filter(l=>l.status==='Negative').length;
    
const totalAmount = leads
  .filter(l => l.status === "Conversion")
  .reduce((sum, l) => sum + (Number(l.amount) || 0), 0);
    const stats = [
      { key:'total',      label:'TOTAL LEADS',  value: total,      icon:`<path d="M4 4h16v4H4zM4 12h16M4 16h16M4 20h10"/>`,        gradient:'from-blue-600 to-indigo-700',    ringColor:'ring-white/70' },
      { key:'Positive',   label:'POSITIVE',     value: positive,   icon:`<path d="M7 14l3-3 3 3 5-6"/>`,                          gradient:'from-orange-500 to-amber-600',   ringColor:'ring-white/70' },
      { key:'Accepted',   label:'ACCEPTED',     value: accepted,   icon:`<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>`, gradient:'from-teal-500 to-emerald-600',   ringColor:'ring-white/70' },
      { key:'Conversion', label:'CONVERSION',   value: conversion, icon:`<path d="M5 13l4 4L19 7"/>`,                              gradient:'from-purple-600 to-fuchsia-600', ringColor:'ring-white/70' },
      { key:'Negative',   label:'NEGATIVE',     value: negative,   icon:`<circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/>`, gradient:'from-rose-600 to-red-700',  ringColor:'ring-white/70' },
      { key:'Revenue',    label:'TOTAL REVENUE',value: '₹' + totalAmount.toLocaleString('en-IN'), icon:`<path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>`, gradient:'from-green-600 to-emerald-700', ringColor:'ring-white/70' },
    ];

    document.getElementById('statCards').innerHTML = stats.map(s => {
      const isActive = activeCardFilter === s.key;
      const activeCls  = isActive ? `ring-2 ${s.ringColor} ring-offset-2 ring-offset-[#0A0E17] scale-[1.02] shadow-lg` : '';
      const clickHint  = isActive ? 'opacity-100' : 'opacity-0 group-hover:opacity-80';
      return `
      <div data-card-key="${s.key}" class="stat-card group bg-gradient-to-br ${s.gradient} rounded-2xl shadow-card p-5 text-white ${activeCls} relative select-none">
        <div class="flex items-center justify-between mb-3">
          <span class="text-sm font-bold tracking-wide text-white/90 uppercase">${s.label}</span>
          <div class="w-9 h-9 rounded-lg bg-white/15 text-white flex items-center justify-center shrink-0">
            <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${s.icon}</svg>
          </div>
        </div>
        <div class="font-body font-bold text-3xl text-white">${s.value}</div>
        <div class="mt-2 text-[10px] font-semibold text-white/80 ${clickHint} transition-opacity flex items-center gap-1">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
          ${isActive ? 'Click to clear' : 'Click to filter'}
        </div>
      </div>
    `;
    }).join('');
  }

  function populateServiceFilter(){
    const services = [...new Set(leads.map(l=>l.service))];
    const sel = document.getElementById('serviceFilter');
    if(sel.dataset.done) return;
    services.forEach(s=>{
      const opt = document.createElement('option');
      opt.value = s; opt.textContent = s;
      sel.appendChild(opt);
    });
    sel.dataset.done = "1";
  }

  function getFiltered(){
    return leads
      .map((l,i)=>({...l, sl:i+1}))
      .filter(l=>{
        const q = activeSearch.toLowerCase();
        const matchesSearch = !q || l.name.toLowerCase().includes(q) || l.mobile.includes(q) || l.email.toLowerCase().includes(q);
        const matchesService = !activeService || l.service === activeService;
        const matchesStatus = !activeStatus || l.status === activeStatus;
        return matchesSearch && matchesService && matchesStatus;
      });
  }

  function statusSelect(l, idx){
    const s = statusStyles[l.status] || statusStyles['Positive'];
    const arrow = arrowFor(arrowColor[l.status] || arrowColor['Positive']);
    return `
      <select data-status-idx="${idx}" style='background-image:${arrow}' class="status-select ${s.bg} ${s.text} text-sm font-bold rounded-full pl-3.5 pr-8 py-2 border border-current focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-offset-[#0D1220] cursor-pointer">
        <option class="bg-[#0D1220] text-white" value="Positive" ${l.status==='Positive'?'selected':''}>Positive</option>
        <option class="bg-[#0D1220] text-white" value="Negative" ${l.status==='Negative'?'selected':''}>Negative</option>
        <option class="bg-[#0D1220] text-white" value="Accepted" ${l.status==='Accepted'?'selected':''}>Accepted</option>
        <option class="bg-[#0D1220] text-white" value="Conversion" ${l.status==='Conversion'?'selected':''}>Conversion</option>
      </select>
    `;
  }

  function amountBlock(l, idx){
    return `
      <div class="flex items-center gap-1.5">
        <span class="text-gray-500 text-xs font-mono">₹</span>
        <input type="number" min="0" data-amount-idx="${idx}" value="${l.amount || ''}" placeholder="0"
              class="amount-input w-20 bg-[#0A0E17] border border-white/10 rounded-lg px-2 py-1.5 text-[13px] font-mono text-gray-100 focus:outline-none focus:ring-2 focus:ring-purple-500/40 focus:border-purple-400/40">
        <button data-tick-idx="${idx}" title="Save amount"
                class="amt-tick w-7 h-7 rounded-lg bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500 hover:text-white flex items-center justify-center transition-colors shrink-0">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>
        </button>
      </div>
    `;
  }

  /* ============ RENDER TABLE ============ */
  function renderTable(){
    const allRows = getFiltered();
    const totalPages = Math.ceil(allRows.length / itemsPerPage);
    if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;
    const rows = allRows.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

    document.getElementById('resultsBadge').textContent = `${allRows.length} results`;
    const body = document.getElementById('tableBody');
    document.getElementById('emptyStateDesktop').classList.toggle('hidden', allRows.length !== 0);

    const avatarGradients = ['from-blue-500 to-indigo-600','from-orange-500 to-amber-600','from-purple-500 to-fuchsia-600','from-teal-500 to-emerald-600','from-pink-500 to-rose-600'];

    body.innerHTML = rows.map(l => `
      <tr class="row-fade hover:bg-white/[0.03] transition-colors">
        <td class="px-5 py-4 text-cyan-400 font-mono text-sm font-bold align-middle">${String(l.sl).padStart(2,'0')}</td>
        <td class="px-5 py-4 align-middle">
          <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-full bg-gradient-to-br ${avatarGradients[l.sl % avatarGradients.length]} text-white flex items-center justify-center font-display font-bold text-xs shrink-0">${l.name.split(' ').map(w=>w[0]).slice(0,2).join('')}</div>
            <span class="font-semibold text-white text-base">${l.name}</span>
          </div>
        </td>
        <td class="px-5 py-4 align-middle font-mono text-sm font-semibold text-cyan-300">${l.mobile}</td>
        <td class="px-5 py-4 align-middle text-sm text-gray-300 truncate max-w-[190px]" title="${l.email}">${l.email}</td>
        <td class="px-5 py-4 align-middle">
          <div class="flex items-center gap-2">
            <svg class="w-4 h-4 text-amber-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${serviceIcons[l.service] || ''}</svg>
            <span class="text-sm text-amber-200 font-medium">${l.service}</span>
          </div>
        </td>
        <td class="px-5 py-4 align-middle">${statusSelect(l, l.sl-1)}</td>
        <td class="px-5 py-4 align-middle">${amountBlock(l, l.sl-1)}</td>
        <td class="px-5 py-4 align-middle">
          <div class="flex items-center justify-center gap-1.5">${actionIcons(l, 'w-10 h-10')}</div>
        </td>
      </tr>
    `).join('');
  }

  /* ============ RENDER CARDS (mobile/tablet) ============ */
  function renderCards(){
    const allRows = getFiltered();
    const totalPages = Math.ceil(allRows.length / itemsPerPage);
    if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;
    const rows = allRows.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

    const list = document.getElementById('cardList');
    document.getElementById('emptyStateMobile').classList.toggle('hidden', allRows.length !== 0);

    list.innerHTML = rows.map(l => `
      <div class="row-fade bg-[#0A0E17] border border-white/10 rounded-2xl p-4">
        <div class="flex items-start justify-between gap-3 mb-3">
          <div class="flex items-center gap-2">
            <div>
              <div class="font-semibold text-white text-sm leading-tight">${l.name}</div>
              <div class="text-[11px] text-gray-500 font-mono mt-0.5">Sl. ${String(l.sl).padStart(2,'0')} · ${l.mobile}</div>
            </div>
          </div>
          ${statusSelect(l, l.sl-1)}
        </div>

        <div class="space-y-2 mb-3.5">
          <div class="flex items-center gap-2 px-1">
            <svg class="w-4 h-4 text-gray-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            <span class="text-[13px] text-gray-300 truncate">${l.email}</span>
          </div>
          <div class="flex items-center gap-2 px-1">
            <svg class="w-4 h-4 text-amber-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${serviceIcons[l.service] || ''}</svg>
            <span class="text-[13px] text-amber-200">${l.service}</span>
          </div>
          <div class="flex items-center gap-2 px-1 pt-1">
            <span class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Amount</span>
            ${amountBlock(l, l.sl-1)}
          </div>
        </div>

        <div class="flex items-center gap-1.5 pt-3 border-t border-white/5 mt-1">${actionIcons(l, 'w-10 h-10')}</div>
      </div>
    `).join('');
  }

  function renderPagination() {
    const allRows = getFiltered();
    const totalItems = allRows.length;
    const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
    
    const container = document.getElementById('paginationContainer');
    if (totalItems === 0) {
      container.classList.add('hidden');
      container.classList.remove('flex');
      return;
    }
    container.classList.remove('hidden');
    container.classList.add('flex');

    const startItem = (currentPage - 1) * itemsPerPage + 1;
    const endItem = Math.min(currentPage * itemsPerPage, totalItems);
    
    document.getElementById('pageStartItem').textContent = startItem;
    document.getElementById('pageEndItem').textContent = endItem;
    document.getElementById('pageTotalItems').textContent = totalItems;

    let buttonsHTML = '';
    buttonsHTML += `<button data-page="${currentPage - 1}" class="page-btn px-3 py-1.5 rounded-lg text-sm font-semibold transition-all ${currentPage === 1 ? 'bg-gray-800 text-gray-500 cursor-not-allowed' : 'bg-gray-800 text-gray-300 hover:bg-gray-700 hover:text-white'}" ${currentPage === 1 ? 'disabled' : ''}>Prev</button>`;
    
    let startPage = Math.max(1, currentPage - 2);
    let endPage = Math.min(totalPages, startPage + 4);
    if (endPage - startPage < 4) {
      startPage = Math.max(1, endPage - 4);
    }

    for (let i = startPage; i <= endPage; i++) {
      buttonsHTML += `<button data-page="${i}" class="page-btn w-8 h-8 flex items-center justify-center rounded-lg text-sm font-semibold transition-all ${i === currentPage ? 'bg-purple-600 text-white shadow-md' : 'bg-gray-800 text-gray-300 hover:bg-gray-700 hover:text-white'}">${i}</button>`;
    }

    buttonsHTML += `<button data-page="${currentPage + 1}" class="page-btn px-3 py-1.5 rounded-lg text-sm font-semibold transition-all ${currentPage === totalPages ? 'bg-gray-800 text-gray-500 cursor-not-allowed' : 'bg-gray-800 text-gray-300 hover:bg-gray-700 hover:text-white'}" ${currentPage === totalPages ? 'disabled' : ''}>Next</button>`;
    document.getElementById('paginationButtons').innerHTML = buttonsHTML;
  }

  function renderAll(){ renderTable(); renderCards(); renderPagination(); }

  /* ============ STAT CARD CLICK FILTER ============ */
  document.getElementById('statCards').addEventListener('click', (e) => {
    const card = e.target.closest('[data-card-key]');
    if (!card) return;
    const key = card.dataset.cardKey;

    if (key === 'total') {
      if (activeCardFilter === 'total') return; // already selected
      activeCardFilter = 'total';
      activeStatus = '';
      currentPage = 1;
      document.getElementById('statusFilterTop').value = '';
      hidePill();
    } else {
      if (activeCardFilter === key) return; // Do nothing if already selected
      activeCardFilter = key;
      activeStatus = key; // Negative, Positive, Accepted, Conversion all map directly
      currentPage = 1;
      document.getElementById('statusFilterTop').value = key;
      showPill(key + ' leads');
    }

    renderStats();
    renderAll();
  });

  function showPill(label) {
    const pill = document.getElementById('activeFilterPill');
    document.getElementById('activeFilterLabel').textContent = 'Showing: ' + label;
    pill.classList.remove('hidden');
  }
  function hidePill() {
    document.getElementById('activeFilterPill').classList.add('hidden');
  }
  document.getElementById('clearFilterBtn').addEventListener('click', () => {
    activeCardFilter = '';
    activeStatus = '';
    currentPage = 1;
    document.getElementById('statusFilterTop').value = '';
    hidePill();
    renderStats();
    renderAll();
  });

  /* ============ EVENTS ============ */
  document.addEventListener('click', (e) => {
    const pageBtn = e.target.closest('.page-btn');
    if (pageBtn && !pageBtn.disabled) {
      currentPage = Number(pageBtn.dataset.page);
      renderAll();
      return;
    }
  });

  document.addEventListener('change', (e)=>{
    const sel = e.target.closest('[data-status-idx]');
    if(sel){
      const idx = Number(sel.dataset.statusIdx);
      const ld = leads[idx];
      const newStatus = sel.value;
      const token = sessionStorage.getItem('adminToken');
      
      sel.disabled = true;
      fetch(`https://vkservicesenterprise.in/api/leads/status/${ld.id}`, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ status: newStatus })
      })
      .then(res => res.json())
      .then(data => {
        sel.disabled = false;
        if (data.success) {
          ld.status = newStatus;
          toast(`${ld.name.split(' ')[0]}'s status set to ${newStatus}`);
          renderStats();
          renderAll();
        } else {
          toast('Failed to update status');
          sel.value = ld.status;
        }
      })
      .catch(err => {
        sel.disabled = false;
        sel.value = ld.status;
        console.error(err);
        toast('Error updating status');
      });
    }
  });

  document.addEventListener('click', (e)=>{
    const delBtn = e.target.closest('[data-delete-idx]');
    if (delBtn) {
      const idx = Number(delBtn.dataset.deleteIdx);
      const ld = leads[idx];
      
      Swal.fire({
        title: 'Are you sure?',
        text: `Do you want to ${currentView === 'active' ? 'move this lead to archive' : 'permanently delete this lead'}?`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#8B5CF6',
        cancelButtonColor: '#d33',
        confirmButtonText: 'Yes, proceed!'
      }).then((result) => {
        if (result.isConfirmed) {
          const token = sessionStorage.getItem('adminToken');
          delBtn.disabled = true;
          
          const deleteEndpoint = currentView === 'archived' ? `/leads/archive/delete/${ld.id}` : `/leads/delete/${ld.id}`;
          
          fetch(`https://vkservicesenterprise.in/api${deleteEndpoint}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
          })
          .then(res => res.json().catch(() => ({}))) // Fallback if not JSON
          .then(data => {
            if (data.success || data.message === "Lead deleted" || data.message === "Lead deleted successfully" || !data.error) {
              Swal.fire({
                title: currentView === 'active' ? 'Moved to Archive!' : 'Deleted!',
                text: currentView === 'active' ? 'The lead has been moved to the archive.' : 'The lead has been permanently deleted.',
                icon: 'success',
                confirmButtonColor: '#8B5CF6'
              });
              fetchLeads(); // refresh the list
            } else {
              Swal.fire('Error', data.message || 'Failed to process lead', 'error');
              delBtn.disabled = false;
            }
          })
          .catch(err => {
            console.error(err);
            Swal.fire('Error', 'An error occurred during the request', 'error');
            delBtn.disabled = false;
          });
        }
      });
      return;
    }

    const tick = e.target.closest('[data-tick-idx]');
    if(tick){
      const idx = Number(tick.dataset.tickIdx);
      const ld = leads[idx];
      const input = document.querySelector(`.amount-input[data-amount-idx="${idx}"]`);
      const val = Number(input.value) || 0;
      const token = sessionStorage.getItem('adminToken');
      
      tick.disabled = true;
      fetch(`https://vkservicesenterprise.in/api/leads/amount/${ld.id}`, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ amount: val })
      })
      .then(res => res.json())
      .then(data => {
        tick.disabled = false;
        if (data.success) {
          ld.amount = val;
          tick.classList.remove('saved'); void tick.offsetWidth; tick.classList.add('saved');
          toast(`Amount ₹${val.toLocaleString('en-IN')} saved for ${ld.name.split(' ')[0]}`);
          renderStats();
        } else {
          toast('Failed to update amount');
        }
      })
      .catch(err => {
        tick.disabled = false;
        console.error(err);
        toast('Error updating amount');
      });
    }
  });


  /* SEARCH & FILTER LISTENERS */
  document.getElementById('searchInput').addEventListener('input', (e) => {
    activeSearch = e.target.value;
    currentPage = 1;
    renderAll();
  });
  document.getElementById('serviceFilter').addEventListener('change', (e) => {
    activeService = e.target.value;
    currentPage = 1;
    renderAll();
  });
  document.getElementById('statusFilterTop').addEventListener('change', (e) => {
    activeStatus = e.target.value;
    activeCardFilter = activeStatus || 'total';
    currentPage = 1;
    if (!activeStatus) {
      hidePill();
    } else {
      showPill(activeStatus + ' leads');
    }
    renderStats();
    renderAll();
  });

  /* ============ USER DROPDOWN LOGIC ============ */
  const userMenuBtn = document.getElementById('userMenuBtn');
  const userDropdown = document.getElementById('userDropdown');
  const logoutBtn = document.getElementById('logoutBtn');

  if (userMenuBtn && userDropdown) {
    userMenuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      userDropdown.classList.toggle('hidden');
    });

    document.addEventListener('click', (e) => {
      if (!userMenuBtn.contains(e.target) && !userDropdown.contains(e.target)) {
        userDropdown.classList.add('hidden');
      }
    });
  }

  if (logoutBtn) {
    logoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem('adminLoggedIn');
      sessionStorage.removeItem('adminToken');
      window.location.href = 'admin-login.html';
    });
  }

  /* ============ CHANGE PASSWORD LOGIC ============ */
  const openChangePasswordBtn = document.getElementById('openChangePasswordBtn');
  const changePasswordModal = document.getElementById('changePasswordModal');
  const closeChangePasswordModal = document.getElementById('closeChangePasswordModal');
  const changePasswordForm = document.getElementById('changePasswordForm');
  const changePasswordError = document.getElementById('changePasswordError');
  const submitChangePasswordBtn = document.getElementById('submitChangePasswordBtn');

  // Toggle password visibility
  const setupPasswordToggle = (btnId, inputId, iconId) => {
    const btn = document.getElementById(btnId);
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (btn && input && icon) {
      btn.addEventListener('click', () => {
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        icon.innerHTML = isHidden
          ? '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.6 20.6 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a20.6 20.6 0 0 1-3.44 4.24M1 1l22 22"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/>'
          : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
      });
    }
  };

  setupPasswordToggle('toggleOldPassword', 'oldPassword', 'eyeIconOld');
  setupPasswordToggle('toggleNewPassword', 'newPassword', 'eyeIconNew');
  setupPasswordToggle('toggleConfirmPassword', 'confirmPassword', 'eyeIconConfirm');

  if (openChangePasswordBtn && changePasswordModal) {
    openChangePasswordBtn.addEventListener('click', () => {
      if (userDropdown) userDropdown.classList.add('hidden');
      changePasswordModal.classList.remove('hidden');
    });
  }

  if (closeChangePasswordModal) {
    closeChangePasswordModal.addEventListener('click', () => {
      changePasswordModal.classList.add('hidden');
      changePasswordForm.reset();
      changePasswordError.classList.add('hidden');
    });
  }

  if (changePasswordForm) {
    changePasswordForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      changePasswordError.classList.add('hidden');
      
      const oldPassword = document.getElementById('oldPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const token = sessionStorage.getItem('adminToken');

      if (newPassword !== confirmPassword) {
        changePasswordError.textContent = "New password and confirm password do not match";
        changePasswordError.classList.remove('hidden');
        return;
      }

      submitChangePasswordBtn.disabled = true;
      submitChangePasswordBtn.textContent = 'Updating...';

      try {
        const res = await fetch(`https://vkservicesenterprise.in/api/admin/change-password`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ oldPassword, newPassword, confirmPassword })
        });
        const data = await res.json();
        
        if (data.success) {
          Swal.fire({
            title: 'Success!',
            text: 'Password changed successfully.',
            icon: 'success',
            confirmButtonColor: '#9333ea'
          }).then(() => {
            sessionStorage.removeItem('adminLoggedIn');
            sessionStorage.removeItem('adminToken');
            window.location.href = 'admin-login.html';
          });
        } else {
          changePasswordError.textContent = data.message || 'Failed to change password';
          changePasswordError.classList.remove('hidden');
        }
      } catch (err) {
        changePasswordError.textContent = 'An error occurred';
        changePasswordError.classList.remove('hidden');
      } finally {
        submitChangePasswordBtn.disabled = false;
        submitChangePasswordBtn.textContent = 'Change Password';
      }
    });
  }

  /* ============ INIT ============ */
  fetchLeads();
  </script>
  </body>
  </html>
